<meta name="robots" content="index, follow">
<link rel="alternate" hreflang="en" href="{{ '/bc-invoice-portal/' | absolute_url }}">
<link rel="alternate" hreflang="lt" href="{{ '/lt/bc-invoice-portal/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/bc-invoice-portal/' | absolute_url }}">
{% if page.lang == 'en' %}<meta property="og:locale" content="en_US">{% endif %}
<meta property="og:locale:alternate" content="{{ page.alternate_locale }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": "{{ site.url }}/bc-invoice-portal/#application",
  "name": "BC Invoice Portal",
  "url": "{{ page.url | absolute_url }}",
  "description": {{ page.description | jsonify }},
  "applicationCategory": "BusinessApplication",
  "author": {"@id": "{{ site.url }}/#person"}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "@id": "{{ page.url | absolute_url }}#video",
  "name": {{ page.video_title | jsonify }},
  "description": {{ page.video_description | jsonify }},
  "inLanguage": {{ page.lang | jsonify }},
  "thumbnailUrl": "https://i.ytimg.com/vi/{{ page.video_id }}/hqdefault.jpg",
  "uploadDate": {{ page.video_upload_date | jsonify }},
  "duration": "PT1M54S",
  "embedUrl": "https://www.youtube-nocookie.com/embed/{{ page.video_id }}",
  "url": "https://www.youtube.com/watch?v={{ page.video_id }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": {"@id": "{{ site.url }}/#person"}
}
</script>
<style>
  body { padding: 0; background: #f5f7fa; color: #142a42; }
  main { max-width: none; }
  .product * { box-sizing: border-box; }
  .product .wrap { max-width: 1200px; margin: auto; padding: 0 28px; }
  .product a { color: #1263a7; text-underline-offset: 3px; }
  .product header { background: #fff; border-bottom: 1px solid #dbe5f0; }
  .product nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 72px; padding: 18px 0; }
  .product .brand { font-weight: 700; color: #102b50; text-decoration: none; }
  .product .navlinks { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; font-size: .92rem; }
  .product .navlinks a { font-weight: 600; text-decoration: none; }
  .product .languages { white-space: nowrap; }
  .product [aria-current="page"] { color: #142a42; font-weight: 800; text-decoration: underline; text-underline-offset: 5px; }
  .product section { padding: 52px 0; }
  .product .product-hero { background: #fff; padding: 48px 0 52px; border-bottom: 1px solid #dbe5f0; }
  .product .hero-grid { display: grid; grid-template-columns: minmax(0,.88fr) minmax(0,1.12fr); align-items: center; gap: 42px; }
  .product .product-name { margin: 0 0 16px; color: #1263a7; font-size: 1.55rem; line-height: 1.25; font-weight: 750; letter-spacing: -.02em; }
  .product h1 { font-size: clamp(1.9rem,2.7vw,2.5rem); line-height: 1.15; letter-spacing: -.035em; margin: 0 0 18px; color: #102b50; }
  .product .hero-description { margin: 0; font-size: 1rem; line-height: 1.65; color: #52677d; max-width: 540px; }
  .product h2 { font-size: clamp(1.5rem,2.2vw,1.9rem); line-height: 1.3; letter-spacing: -.02em; margin: 0 0 14px; }
  .product h3 { font-size: 1.06rem; line-height: 1.4; margin: 0 0 12px; }
  .product .intro { max-width: 790px; color: #52677d; margin: 0; }
  .product .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .product .button { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 7px; font-size: .94rem; font-weight: 700; text-decoration: none; }
  .product .primary { background: #00b99f; border: 1px solid #00b99f; color: #062d33; }
  .product .secondary { border: 1px solid #c6d5e4; color: #142a42; background: #fff; }
  .product .outline { border: 1px solid #8fb6d6; color: #fff; }
  .product .primary:hover { background: #19ccb3; }
  .product .secondary:hover { background: #f3f7fc; }
  .product .white { background: #fff; }
  .product .grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; margin-top: 26px; }
  .product .card { background: #fff; padding: 24px; border: 1px solid #dbe5f0; border-radius: 10px; }
  .product .card p { color: #52677d; margin: 0; }
  .product .steps { max-width: 820px; padding-left: 28px; margin-bottom: 0; }
  .product .steps li { padding: 8px 0 8px 8px; }
  .product .steps li::marker { color: #1263a7; font-weight: 750; }
  .product .note { border-left: 3px solid #00b99f; padding: 4px 0 4px 20px; max-width: 880px; margin: 26px 0 0; }
  .product .demonstration { margin: 0; min-width: 0; scroll-margin-top: 24px; }
  .product .demo-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .product .demo-heading h2 { font-size: .9rem; letter-spacing: 0; margin: 0; color: #52677d; font-weight: 600; }
  .product .demo-duration { color: #52677d; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .product .video { aspect-ratio: 16 / 9; background: #102b50; border: 1px solid #dbe5f0; border-radius: 10px; overflow: hidden; }
  .product .video iframe { display: block; width: 100%; height: 100%; border: 0; }
  .product figcaption { font-size: .84rem; line-height: 1.5; color: #52677d; margin-top: 12px; }
  .product .contact { background: #102b50; color: #fff; }
  .product .contact p { max-width: 790px; color: #dceafb; }
  .product .contact a { color: #fff; overflow-wrap: anywhere; }
  .product .contact .primary { color: #062d33; }
  .product .contact-details { display: flex; flex-wrap: wrap; gap: 12px 28px; }
  .product footer { background: #071b32; color: #c0d4e5; padding: 24px 0; }
  .product footer a { color: #d6efff; }
  .product a:focus-visible { outline: 3px solid #1263a7; outline-offset: 5px; }
  .product .contact a:focus-visible { outline-color: #92f2e6; }
  .product .skip { position: absolute; left: 18px; top: -100px; padding: 12px; background: white; z-index: 1; }
  .product .skip:focus { top: 12px; }
  @media(max-width:900px) {
    .product .hero-grid { grid-template-columns: 1fr; gap: 30px; }
    .product .hero-copy { max-width: 640px; }
    .product .hero-description { max-width: none; }
    .product h1 { max-width: 640px; font-size: 2.2rem; }
    .product .grid { grid-template-columns: 1fr; }
  }
  @media(max-width:600px) {
    .product .wrap { padding: 0 20px; }
    .product nav { flex-wrap: wrap; gap: 12px; padding: 16px 0; min-height: 0; }
    .product .navlinks { width: 100%; justify-content: space-between; gap: 10px; font-size: .82rem; }
    .product .brand { font-size: .92rem; }
    .product section { padding: 36px 0; }
    .product .product-hero { padding: 28px 0 32px; }
    .product .product-name { font-size: 1.4rem; margin-bottom: 12px; }
    .product h1 { font-size: 1.75rem; line-height: 1.16; margin-bottom: 14px; }
    .product .hero-description { font-size: .94rem; line-height: 1.55; }
    .product .hero-grid { gap: 26px; }
    .product .buttons { margin-top: 18px; gap: 10px; }
    .product .button { font-size: .86rem; padding: 10px 14px; }
    .product .demo-heading { margin-bottom: 8px; }
    .product .demo-heading h2 { font-size: .84rem; }
    .product figcaption { font-size: .79rem; margin-top: 9px; }
    .product .card { padding: 20px; }
  }
</style>
