<meta name="robots" content="index, follow">
<link rel="alternate" hreflang="en" href="{{ '/bc-invoice-portal/' | absolute_url }}">
<link rel="alternate" hreflang="lt" href="{{ '/lt/bc-invoice-portal/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/bc-invoice-portal/' | absolute_url }}">
{% if page.lang == 'en' %}<meta property="og:locale" content="en_US">{% endif %}
<meta property="og:locale:alternate" content="{{ page.alternate_locale }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": "{{ site.url }}/bc-invoice-portal/#application",
  "name": "BC Invoice Portal",
  "url": "{{ page.url | absolute_url }}",
  "description": {{ page.description | jsonify }},
  "applicationCategory": "BusinessApplication",
  "author": {"@id": "{{ site.url }}/#person"}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "@id": "{{ page.url | absolute_url }}#video",
  "name": {{ page.video_title | jsonify }},
  "description": {{ page.video_description | jsonify }},
  "inLanguage": {{ page.lang | jsonify }},
  "thumbnailUrl": "https://i.ytimg.com/vi/{{ page.video_id }}/hqdefault.jpg",
  "uploadDate": {{ page.video_upload_date | jsonify }},
  "duration": "PT1M54S",
  "embedUrl": "https://www.youtube-nocookie.com/embed/{{ page.video_id }}",
  "url": "https://www.youtube.com/watch?v={{ page.video_id }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": {"@id": "{{ site.url }}/#person"}
}
</script>
<style>
  body { padding: 0; background: #f3f7fc; color: #142a42; }
  main { max-width: none; }
  .product * { box-sizing: border-box; }
  .product .wrap { max-width: 1100px; margin: auto; padding: 0 24px; }
  .product a { color: #1263a7; }
  .product header { background: #fff; border-bottom: 1px solid #dbe5f0; }
  .product nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; padding: 20px 0; }
  .product .brand { font-weight: 700; color: #102b50; text-decoration: none; }
  .product .navlinks { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .product .navlinks a { font-weight: 600; text-decoration: none; }
  .product .languages { white-space: nowrap; }
  .product [aria-current="page"] { color: #142a42; font-weight: 800; text-decoration: underline; text-underline-offset: 5px; }
  .product section { padding: 64px 0; }
  .product .hero { background: linear-gradient(125deg,#102b50,#12487a); color: #fff; padding: 76px 0; }
  .product .eyebrow { color: #92f2e6; font-weight: 800; letter-spacing: .08em; }
  .product h1 { max-width: 900px; font-size: clamp(2rem,5vw,3.5rem); line-height: 1.14; letter-spacing: -.035em; margin: 16px 0 24px; }
  .product .hero p { max-width: 790px; font-size: 1.16rem; color: #dceafb; }
  .product h2 { font-size: clamp(1.6rem,3vw,2.2rem); line-height: 1.25; margin: 0 0 18px; }
  .product h3 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 12px; }
  .product .intro { max-width: 790px; color: #52677d; }
  .product .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .product .button { display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 12px 22px; border-radius: 9px; font-weight: 800; text-decoration: none; }
  .product .primary { background: #00b99f; color: #062d33; }
  .product .outline { border: 1px solid #8fb6d6; color: #fff; }
  .product .primary:hover { background: #19ccb3; }
  .product .white { background: #fff; }
  .product .grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; margin-top: 28px; }
  .product .card { background: #fff; padding: 25px; border: 1px solid #dbe5f0; border-radius: 14px; box-shadow: 0 7px 20px #102b5008; }
  .product .card p { color: #52677d; margin-bottom: 0; }
  .product .steps { max-width: 820px; padding-left: 28px; }
  .product .steps li { padding: 9px 0 9px 8px; }
  .product .steps li::marker { color: #1263a7; font-weight: 800; }
  .product .note { border-left: 4px solid #00b99f; padding: 4px 0 4px 22px; max-width: 880px; margin: 28px 0 0; }
  .product .video { aspect-ratio: 16 / 9; background: #102b50; border-radius: 14px; overflow: hidden; margin-top: 26px; }
  .product .video iframe { display: block; width: 100%; height: 100%; border: 0; }
  .product .contact { background: #102b50; color: #fff; }
  .product .contact p { max-width: 790px; color: #dceafb; }
  .product .contact a { color: #fff; overflow-wrap: anywhere; }
  .product .contact .primary { color: #062d33; }
  .product .contact-details { display: flex; flex-wrap: wrap; gap: 12px 28px; }
  .product footer { background: #071b32; color: #c0d4e5; padding: 24px 0; }
  .product footer a { color: #d6efff; }
  .product a:focus-visible { outline: 3px solid #1263a7; outline-offset: 5px; }
  .product .hero a:focus-visible,.product .contact a:focus-visible { outline-color: #92f2e6; }
  .product .skip { position: absolute; left: 18px; top: -100px; padding: 12px; background: white; z-index: 1; }
  .product .skip:focus { top: 12px; }
  @media(max-width:750px) { .product .grid { grid-template-columns: 1fr; } .product nav { align-items: flex-start; flex-direction: column; } }
  @media(max-width:530px) { .product .wrap { padding: 0 18px; } .product section { padding: 44px 0; } .product .hero { padding: 48px 0; } .product .buttons .button { width: 100%; } }
</style>
